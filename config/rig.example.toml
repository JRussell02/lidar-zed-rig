# Rig settings for lidarzed-record. Copy to config/rig.toml (git-ignored) and edit.
# Command-line options override these.

[sensor]
# OS1 hostname (os-<serial>.local) or IP. `ouster-cli discover` lists it.
host = "os-XXXXXXXXXXXX.local"

[camera]
resolution = "720"          # 2K | 1080 | 720 | VGA (per-eye 1280x720 at "720")
fps = 15                    # JPEGs saved per second
upside_down = true          # how the ZED is mounted (recorded in meta.json; images are saved raw)
lens_calibration = "calibration/2026-10-28/SN17516.conf"   # ZED factory file, from calib.stereolabs.com/?SN=<serial>

[paths]
sessions = "sessions"       # where recordings go
